name: caseflow
description: CaseFlow - Legal Case Management App
publish_to: 'none'
version: 3.0.0+4

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.12.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI Tools
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  fl_chart: ^0.70.2

  # File handling
  emoji_picker_flutter: ^3.1.0
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  table_calendar: ^3.1.3
  path_provider: ^2.1.5
  pdf: ^3.11.2
  printing: ^5.13.4
  share_plus: ^10.1.4
  open_file: ^3.5.10
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  speech_to_text: ^7.0.0
  connectivity_plus: ^6.1.1
  razorpay_flutter: ^1.4.1
  dio: ^5.8.0
  http: ^1.2.0
  path: ^1.9.1
  crypto: ^3.0.6
  dart_jsonwebtoken: ^2.1.2
  google_sign_in: ^7.2.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_crashlytics: ^4.3.5
  firebase_analytics: ^11.4.5
  sqflite: ^2.4.2
  # Direct dependency: used by settings_screen.dart and locale_service.dart.
  # It was previously only pulled in transitively, so a `pub upgrade` that
  # dropped the intermediate package would have broken the build.
  shared_preferences: ^2.5.4
  geolocator: ^13.0.2
  record: ^6.1.1
  audioplayers: ^6.1.0
  image_gallery_saver_plus: ^4.0.1
  permission_handler: ^11.3.1
  flutter_local_notifications: ^19.0.0
  syncfusion_flutter_pdf: ^33.2.13
  cunning_document_scanner: ^3.0.3
  image: ^4.10.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/bare_acts/
    - assets/json/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/caseflow_logo.png"
  adaptive_icon_background: "#1a237e"
  adaptive_icon_foreground: "assets/icon/caseflow_logo.png"
