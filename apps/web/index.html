<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="CaseFlow — case management for the trial courts of Tamil Nadu." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CaseFlow</title>
    <script>
      // Apply the saved theme before first paint, so a dark-mode user never
      // sees a white flash while React loads.
      try {
        var t = localStorage.getItem("cf-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
        var l = localStorage.getItem("cf-lang");
        if (l) document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
