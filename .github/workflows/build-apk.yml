name: Build CaseFlow APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── Configure google-services.json ──
      - name: Configure google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > apps/mobile/android/app/google-services.json
            echo "✅ google-services.json decoded from secret"
          elif [ -f apps/mobile/android/app/google-services.json ]; then
            echo "✅ google-services.json already exists in repo"
          else
            echo "Creating default google-services.json for build..."
            cat << 'EOF' > apps/mobile/android/app/google-services.json
{
  "project_info": {
    "project_number": "284424778298",
    "project_id": "caseflow-fd48d",
    "storage_bucket": "caseflow-fd48d.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:284424778298:android:3f6c4394881d289ec4fb03",
        "android_client_info": {
          "package_name": "com.caseflow.app"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyA7i3yO9LAFZ5l9cyTuRjH5JbpFj_WDPbU"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
            echo "✅ Default google-services.json generated for release build"
          fi

      - name: Get dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze code
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Configure Gradle Memory
        working-directory: apps/mobile/android
        run: |
          rm -rf ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build Release APK (split per ABI for smaller size)
        working-directory: apps/mobile
        run: |
          flutter build apk --release --split-per-abi \
            --android-skip-build-dependency-validation \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Build Fat APK (for Firebase Distribution)
        working-directory: apps/mobile
        run: |
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Rename APKs
        run: |
          cp apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             CaseFlow-arm64.apk
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
             CaseFlow-Release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: CaseFlow-Release-APKs
          path: |
            CaseFlow-arm64.apk
            CaseFlow-Release.apk
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CaseFlow-arm64.apk
            CaseFlow-Release.apk
          generate_release_notes: true

      - name: Upload to Firebase App Distribution
        if: env.FIREBASE_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS }}
          groups: testers
          file: CaseFlow-Release.apk

