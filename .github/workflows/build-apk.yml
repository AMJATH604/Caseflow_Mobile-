name: Build CaseFlow APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      # ── Decode google-services.json from secret ──
      - name: Decode google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > apps/mobile/android/app/google-services.json
            echo "✅ google-services.json decoded from secret"
          elif [ -f apps/mobile/android/app/google-services.json ]; then
            echo "✅ google-services.json already exists in repo"
          else
            echo "❌ google-services.json not found! Build will likely fail."
            exit 1
          fi

      - name: Get dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze code
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        working-directory: apps/mobile
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Rename APK
        run: |
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
             CaseFlow-Release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaseFlow-Release-APK
          path: CaseFlow-Release.apk
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CaseFlow-Release.apk
          generate_release_notes: true
