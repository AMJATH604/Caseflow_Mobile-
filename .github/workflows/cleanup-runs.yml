name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      keep_runs:
        description: 'Number of recent runs to keep per workflow'
        default: '10'
        required: false
  schedule:
    - cron: '0 0 * * 0' # Weekly every Sunday at midnight UTC

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete Old Workflow Runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v7
        env:
          KEEP_RUNS: ${{ inputs.keep_runs || '10' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keepCount = parseInt(process.env.KEEP_RUNS || '10', 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log(`Scanning workflows for ${owner}/${repo}...`);
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner,
              repo,
              per_page: 100
            });

            for (const workflow of workflows) {
              console.log(`\nWorkflow: "${workflow.name}" (ID: ${workflow.id})`);
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: workflow.id,
                per_page: 100
              });

              console.log(`Found ${runs.length} total run(s).`);
              if (runs.length <= keepCount) {
                console.log(`No runs to delete (runs: ${runs.length} <= keep: ${keepCount}).`);
                continue;
              }

              // Runs are ordered newest to oldest
              const runsToDelete = runs.slice(keepCount);
              console.log(`Deleting ${runsToDelete.length} old run(s), keeping newest ${keepCount}...`);

              for (const run of runsToDelete) {
                try {
                  console.log(`Deleting run #${run.run_number} (ID: ${run.id}, created: ${run.created_at})...`);
                  await github.rest.actions.deleteWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id
                  });
                } catch (err) {
                  console.error(`Failed to delete run #${run.run_number} (${run.id}): ${err.message}`);
                }
              }
            }
            console.log('\nAll old workflow runs successfully cleaned up!');
