name: Cleanup Old Workflow Runs

on:
  push:
    branches: [main, security/auth-hardening]
  workflow_dispatch:
    inputs:
      keep_runs:
        description: 'Number of recent runs to keep across repository'
        default: '10'
        required: false
  schedule:
    - cron: '0 0 * * 0' # Weekly every Sunday at midnight UTC

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete Old Workflow Runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v7
        env:
          KEEP_RUNS: ${{ inputs.keep_runs || '10' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keepCount = parseInt(process.env.KEEP_RUNS || '10', 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;

            console.log(`Scanning all workflow runs for ${owner}/${repo}...`);
            const allRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100
            });

            console.log(`Found ${allRuns.length} total run(s) across repository.`);

            // Exclude currently executing cleanup run
            const runs = allRuns.filter(r => r.id !== currentRunId);

            // Sort runs newest to oldest
            runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (runs.length <= keepCount) {
              console.log(`Repository has only ${runs.length} runs. No runs need deletion (keep limit: ${keepCount}).`);
              return;
            }

            const runsToDelete = runs.slice(keepCount);
            console.log(`Keeping newest ${keepCount} runs. Deleting ${runsToDelete.length} older runs...\n`);

            let deletedCount = 0;
            let failedCount = 0;

            for (const run of runsToDelete) {
              try {
                console.log(`Deleting run #${run.run_number} ("${run.name}", ID: ${run.id}, created: ${run.created_at})...`);
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                deletedCount++;
                // Small sleep to avoid hitting secondary rate limits
                await new Promise(r => setTimeout(r, 200));
              } catch (err) {
                console.error(`Failed to delete run #${run.run_number} (${run.id}): ${err.message}`);
                failedCount++;
              }
            }

            console.log(`\n========================================`);
            console.log(`Cleanup complete!`);
            console.log(`Deleted: ${deletedCount} run(s)`);
            if (failedCount > 0) {
              console.log(`Failed: ${failedCount} run(s)`);
            }
            console.log(`Remaining newest runs kept: ${keepCount}`);
            console.log(`========================================`);
