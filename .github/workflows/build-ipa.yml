name: Build CaseFlow iOS (IPA)

on:
  push:
    branches: [main, development, security/auth-hardening]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      codesign:
        description: 'Whether to attempt code signing (requires secrets)'
        required: false
        default: false
        type: boolean

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Flutter Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Setup CocoaPods
        run: |
          pod --version

      # ── Configure GoogleService-Info.plist ──
      - name: Configure GoogleService-Info.plist
        run: |
          if [ -n "${{ secrets.IOS_GOOGLE_SERVICES_PLIST }}" ]; then
            echo "${{ secrets.IOS_GOOGLE_SERVICES_PLIST }}" | base64 -d > apps/mobile/ios/Runner/GoogleService-Info.plist
            echo "✅ GoogleService-Info.plist decoded from secret"
          elif [ -f apps/mobile/ios/Runner/GoogleService-Info.plist ]; then
            echo "✅ GoogleService-Info.plist already present"
          else
            echo "⚠️ GoogleService-Info.plist not found! Creating dummy plist for CI build..."
            echo "" | base64 -d > apps/mobile/ios/Runner/GoogleService-Info.plist
          fi

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build iOS Application (No Codesign)
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=DOC_TOOLS_API_URL="${{ vars.DOC_TOOLS_API_URL }}"

      - name: Package Payload into unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r apps/mobile/build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr CaseFlow-unsigned.ipa Payload/
          rm -rf Payload
          ls -lh CaseFlow-unsigned.ipa

      - name: Upload iOS App Bundle & IPA
        uses: actions/upload-artifact@v4
        with:
          name: CaseFlow-iOS-Unsigned
          path: |
            build/ios/ipa/CaseFlow-unsigned.ipa
            apps/mobile/build/ios/iphoneos/Runner.app
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/ipa/CaseFlow-unsigned.ipa
          generate_release_notes: true
