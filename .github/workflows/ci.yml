name: CaseFlow CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter-analyze:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/ test/ || echo "::warning::Formatting issues found in codebase. Run 'dart format lib/ test/' to resolve."

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npx eslint src/ --max-warnings=0 || echo "::warning::ESLint warnings found"

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}

  edge-functions:
    name: Edge Functions Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ hashFiles('supabase/functions/deno.json') }}
          restore-keys: deno-

      - name: Check edge functions
        run: |
          failed=0
          for dir in supabase/functions/*/; do
            if [ -f "$dir/index.ts" ]; then
              echo "Checking $dir..."
              # Retry up to 3 times to handle flaky esm.sh CDN
              success=0
              for attempt in 1 2 3; do
                if deno check --config=supabase/functions/deno.json "$dir/index.ts" 2>&1; then
                  success=1
                  break
                fi
                echo "Attempt $attempt failed for $dir, retrying in 10s..."
                sleep 10
              done
              if [ $success -eq 0 ]; then
                echo "::warning::Deno check failed for $dir after 3 attempts (likely CDN issue)"
              fi
            fi
          done

  # Security check — ensure no API keys are hardcoded
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded API keys
        run: |
          # Search for common API key patterns in tracked source, scripts and
          # text files. Widened after an audit found secrets this scan could not
          # see: a service_role JWT in a .txt log, a Gemini key in Google's newer
          # "AQ." format, and GitHub tokens in helper scripts.
          #   AIzaSy / AQ.Ab        Google API keys (both formats)
          #   c2VydmljZV9yb2xl…     base64 of "service_role" at each alignment
          #   sb_secret_            Supabase secret key
          #   gh[pousr]_            GitHub tokens
          #   PRIVATE KEY-----<b64> a real PEM body, not code that strips headers
          # google-services.json ships a Firebase key that is public by design.
          if git ls-files -z -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.dart' '*.txt' '*.ps1' '*.sh' '*.json' '*.sql' '*.yml' '*.yaml' '*.md' '*.env*' \
              ':!:apps/mobile/android/app/google-services.json' ':!:**/package-lock.json' ':!:.github/workflows/ci.yml' \
            | xargs -0 grep -nIE \
              '(AIzaSy[0-9A-Za-z_-]{30,}|AQ\.Ab[0-9A-Za-z_-]{20,}|c2VydmljZV9yb2xl|NlcnZpY2Vfcm9sZ|zZXJ2aWNlX3JvbG|sb_secret_[A-Za-z0-9_-]{10,}|gh[pousr]_[A-Za-z0-9]{30,}|PRIVATE KEY-----(\\n)?[A-Za-z0-9+]{20,}|sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}|xox[baprs]-[A-Za-z0-9-]{10,})'; then
            echo "::error::Potential hardcoded API key detected in source code!"
            exit 1
          fi
          echo "✅ No hardcoded API keys found"

      - name: Check for sensitive files
        run: |
          # Ensure no APK/AAB files are tracked
          if git ls-files '*.apk' '*.aab' | grep -q .; then
            echo "::warning::APK/AAB files found in git. Consider removing with git filter-branch."
          fi
          echo "✅ Sensitive file check complete"
