name: CaseFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter-analyze:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/ test/ || echo "::warning::Formatting issues found in codebase. Run 'dart format lib/ test/' to resolve."

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || echo "::warning::Analysis warnings found in codebase."

      - name: Run tests
        run: flutter test

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npx eslint src/ --max-warnings=0 || echo "::warning::ESLint warnings found"

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  edge-functions:
    name: Edge Functions Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ hashFiles('supabase/functions/deno.json') }}
          restore-keys: deno-

      - name: Check edge functions
        run: |
          failed=0
          for dir in supabase/functions/*/; do
            if [ -f "$dir/index.ts" ]; then
              echo "Checking $dir..."
              # Retry up to 3 times to handle flaky esm.sh CDN
              success=0
              for attempt in 1 2 3; do
                if deno check --config=supabase/functions/deno.json "$dir/index.ts" 2>&1; then
                  success=1
                  break
                fi
                echo "Attempt $attempt failed for $dir, retrying in 10s..."
                sleep 10
              done
              if [ $success -eq 0 ]; then
                echo "::warning::Deno check failed for $dir after 3 attempts (likely CDN issue)"
              fi
            fi
          done

  # Security check — ensure no API keys are hardcoded
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded API keys
        run: |
          # Search for common API key patterns in source code (excluding lock files and node_modules)
          if grep -rn --include="*.ts" --include="*.dart" --include="*.tsx" --include="*.js" \
            -E '(AIzaSy|sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16})' \
            --exclude-dir=node_modules --exclude-dir=build --exclude-dir=.dart_tool .; then
            echo "::error::Potential hardcoded API key detected in source code!"
            exit 1
          fi
          echo "✅ No hardcoded API keys found"

      - name: Check for sensitive files
        run: |
          # Ensure no APK/AAB files are tracked
          if git ls-files '*.apk' '*.aab' | grep -q .; then
            echo "::warning::APK/AAB files found in git. Consider removing with git filter-branch."
          fi
          echo "✅ Sensitive file check complete"

  ios-build-check:
    name: iOS Build Check
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Setup Dummy GoogleService-Info.plist if missing
        run: |
          if [ ! -f ios/Runner/GoogleService-Info.plist ]; then
            cat << 'EOF' > ios/Runner/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key>
            <string>dummy.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>com.googleusercontent.apps.dummy</string>
            <key>API_KEY</key>
            <string>dummy-api-key</string>
            <key>GCM_SENDER_ID</key>
            <string>1234567890</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.caseflow.app</string>
            <key>PROJECT_ID</key>
            <string>caseflow-dummy</string>
            <key>STORAGE_BUCKET</key>
            <string>caseflow-dummy.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false></false>
            <key>IS_ANALYTICS_ENABLED</key>
            <false></false>
            <key>IS_APPINVITE_ENABLED</key>
            <true></true>
            <key>IS_GCM_ENABLED</key>
            <true></true>
            <key>IS_SIGNIN_ENABLED</key>
            <true></true>
            <key>GOOGLE_APP_ID</key>
            <string>1:1234567890:ios:abcdef123456</string>
          </dict>
          </plist>
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build iOS (No Codesign)
        run: flutter build ios --no-codesign --release

